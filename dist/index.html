<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111c27">
  <meta name="description" content="A fresh start for your next big idea. Explore the Vertex login and registration interface.">
  <title>Welcome back · Vertex</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23111c27'/%3E%3Cpath d='M8 9l8 15L24 9h-6l-2 5-2-5z' fill='%23d4f87a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="auth-shell">
    <section class="form-panel" aria-labelledby="form-heading">
      <header class="panel-header"><span class="wordmark">vertex.</span><span class="preview-badge">DESIGN PREVIEW</span></header>
      <div class="form-container">
        <div class="mode-switch" role="tablist" aria-label="Account access">
          <button id="login-tab" role="tab" aria-selected="true" aria-controls="auth-panel" type="button">Log in</button>
          <button id="signup-tab" role="tab" aria-selected="false" aria-controls="auth-panel" tabindex="-1" type="button">Sign up</button>
        </div>
        <div id="auth-panel" role="tabpanel" aria-labelledby="login-tab">
          <div class="form-intro"><div class="intro-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3v4m0 10v4M3 12h4m10 0h4M5.6 5.6l2.8 2.8m7.2 7.2 2.8 2.8m0-12.8-2.8 2.8m-7.2 7.2-2.8 2.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div><h1 id="form-heading">Welcome back.</h1><p id="form-description">Good to see you again. Let’s pick up where you left off.</p></div>
          <form id="auth-form" novalidate>
            <div class="field signup-only" hidden>
              <label for="full-name">Full name</label><input id="full-name" name="name" type="text" placeholder="Alex Morgan" autocomplete="name" aria-describedby="name-error" disabled><span class="field-error" id="name-error"></span>
            </div>
            <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" inputmode="email" required aria-describedby="email-error"><span class="field-error" id="email-error"></span></div>
            <div class="field"><label for="password">Password</label><div class="password-wrap"><input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required aria-describedby="password-hint password-error"><button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false"><svg class="eye" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.5"/><path class="eye-slash" d="M4 3 21 20" stroke="currentColor" stroke-width="1.8"/></svg></button></div><span id="password-hint" class="field-hint signup-only" hidden>Use at least 8 characters.</span><span class="field-error" id="password-error"></span></div>
            <div class="form-options login-only"><label class="checkbox-label"><input type="checkbox" id="remember">Remember me</label><button class="text-button" id="forgot-password" type="button">Forgot password?</button></div>
            <button id="submit-button" class="primary-button" type="submit">Log in</button>
            <p id="form-status" class="form-status" role="status" aria-live="polite" hidden></p>
          </form>
          <div class="divider"><span>or continue with</span></div>
          <div class="social-buttons"><button type="button" data-provider="Google"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.9-1.74 2.98-4.31 2.98-7.36Z"/><path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.62-2.41l-3.24-2.51c-.9.6-2.06.96-3.38.96-2.61 0-4.82-1.76-5.61-4.12H3.05v2.59A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.39 13.92a6 6 0 0 1 0-3.84V7.49H3.05a10 10 0 0 0 0 9.02l3.34-2.59Z"/><path fill="#EA4335" d="M12 5.96c1.47 0 2.79.5 3.83 1.5l2.88-2.88A9.61 9.61 0 0 0 12 2a10 10 0 0 0-8.95 5.49l3.34 2.59C7.18 7.72 9.39 5.96 12 5.96Z"/></svg>Google</button><button type="button" data-provider="GitHub"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.86c-2.78.6-3.37-1.18-3.37-1.18-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.64-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.99 1.03-2.69-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.03a9.57 9.57 0 0 1 5 0c1.91-1.3 2.75-1.03 2.75-1.03.55 1.38.2 2.4.1 2.65.64.7 1.03 1.6 1.03 2.69 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.85v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/></svg>GitHub</button></div>
          <p class="mode-prompt"><span id="mode-prompt-copy">New to Vertex?</span> <button type="button" id="alternate-mode" class="text-button">Create an account</button></p>
        </div>
        <p class="demo-note"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="5" y="8" width="10" height="8" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M7 8V6a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.3"/></svg>Frontend demo. Use sample details; nothing is saved.</p>
      </div>
      <footer class="page-footer"><span>© 2026 Vertex</span><span>Made for a new perspective.</span></footer>
    </section>
  </main>
  <dialog id="info-dialog" aria-labelledby="dialog-title"><button id="close-dialog" class="dialog-close" aria-label="Close dialog" type="button">×</button><div class="dialog-symbol" aria-hidden="true">✳</div><h2 id="dialog-title">A little preview.</h2><p id="dialog-description"></p><button id="dialog-done" class="primary-button" type="button">Got it</button></dialog>
</body>
</html>
